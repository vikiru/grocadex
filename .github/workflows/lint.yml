name: Lint Files
run-name: Lint files using Oxlint
on:
    pull_request:
        branches: [main]
    push:
        branches: [main]
permissions: {}
concurrency:
    group: lint-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true
jobs:
    lint:
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - name: Checkout repo
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
              with:
                  persist-credentials: false
            - name: Setup Node.js
              uses: actions/setup-node@v4.4.0
              with:
                  node-version: '22'
            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
              with:
                  version: 11.20.0
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Install API dependencies
              run: pnpm --dir src/api install --ignore-scripts
            - name: Generate Prisma Client
              run: pnpm --dir src/api exec prisma generate
            - name: Lint files
              run: pnpm lint
            - name: Check formatting
              run: pnpm run format:check
            - name: Type check
              run: pnpm exec tsc --noEmit --pretty false
