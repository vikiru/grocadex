name: Format Files
run-name: Format files using Oxfmt
on:
    push:
        branches: [main]
permissions: {}
concurrency:
    group: format-${{ github.ref }}
    cancel-in-progress: true
jobs:
    format:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - name: Checkout repo
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - name: Setup github-actions[bot] git config
              run: |
                  git config --local user.name 'github-actions[bot]'
                  git config --local user.email '41898282+github-actions[bot]@users.noreply.github.com'
            - name: Setup Node.js
              uses: actions/setup-node@v4.4.0
              with:
                  node-version: '22'
            - name: Setup pnpm
              uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.0.0
              with:
                  version: 11.20.0
            - name: Install dependencies
              run: pnpm install --frozen-lockfile --ignore-scripts
            - name: Format files
              run: pnpm run format
            - name: Commit formatting changes, if any
              env:
                  GITHUB_TOKEN: ${{ github.token }}
              run: |
                  git add -A
                  git diff --staged --quiet || git commit -m 'chore: format files via github actions'
                  git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
