pre-commit:
    parallel: false
    jobs:
        - name: Format staged files with oxfmt
          glob: '*.{js,mjs,cjs,ts,jsx,tsx,json,css}'
          run: 'pnpm format {staged_files}'
          stage_fixed: true
        - name: Lint staged files with oxlint
          glob: '*.{js,mjs,cjs,ts,jsx,tsx}'
          run: 'pnpm lint {staged_files}'

commit-msg:
    jobs:
        - name: Validate commit message
          run: 'pnpm exec commitlint --edit $1'

pre-push:
    parallel: false
    jobs:
        - name: TypeScript verification
          run: 'pnpm typecheck'
